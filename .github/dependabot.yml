version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      androidx:
        patterns:
          - "androidx.*"
      compose-bom:
        patterns:
          - "androidx.compose:compose-bom"
      shizuku:
        patterns:
          - "dev.rikka.shizuku:*"
      kotlin-toolchain:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.android.application"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  # No cargo ecosystem here: the Rust tools live in the android-tools/
  # submodule, a separate repository Dependabot of this repo cannot reach
  # (the old /tools/logstream entry pointed at a folder that never existed).

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
