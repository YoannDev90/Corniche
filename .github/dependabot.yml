version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      androidx:
        patterns:
          - "androidx.*"
      compose-bom:
        patterns:
          - "androidx.compose:compose-bom"
      shizuku:
        patterns:
          - "dev.rikka.shizuku:*"
      kotlin-toolchain:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.android.application"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  # No cargo ecosystem here: the Rust tools moved out to their own repository
  # (the android-tools submodule was removed), so Dependabot of this repo has
  # nothing cargo-related to update. The old /tools/logstream entry pointed
  # at a folder that never existed.

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
